<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login - CBT Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-green-600 via-emerald-600 to-green-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Ornamen daun -->
  <i class="fas fa-leaf absolute top-8 left-8 text-white/10 text-[10rem] rotate-12"></i>
  <i class="fas fa-seedling absolute bottom-8 right-8 text-white/10 text-[8rem] -rotate-12"></i>

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative z-10 border-t-4 border-lime-400">
    <div class="text-center mb-6">
      <div class="w-20 h-20 mx-auto bg-gradient-to-br from-green-500 to-emerald-600 rounded-full flex items-center justify-center shadow-lg mb-3">
        <i class="fas fa-leaf text-white text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-green-800">Login CBT Online</h1>
      <p class="text-gray-500 text-sm">Masukkan kredensial Anda</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm border border-red-300">
          <i class="fas fa-exclamation-circle mr-1"></i> {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-green-900">Username</label>
        <input type="text" name="username" required
               class="w-full px-4 py-2.5 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-green-900">Password</label>
        <input type="password" name="password" required
               class="w-full px-4 py-2.5 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none">
      </div>
      <button type="submit"
              class="w-full py-3 bg-gradient-to-r from-green-600 to-emerald-600 text-white font-semibold rounded-lg hover:from-green-700 hover:to-emerald-700 shadow-md hover:shadow-lg transition">
        <i class="fas fa-sign-in-alt mr-2"></i> Login
      </button>
    </form>

   
    <div class="mt-3 text-center text-sm">
      <a href="{{ url_for('landing') }}" class="text-green-600 hover:text-green-800 hover:underline">
        &larr; Kembali ke Home
      </a>
    </div>
  </div>
</body>
{% include '_dialog.html' %}   <!-- opsional -->
</html>
