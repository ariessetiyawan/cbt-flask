{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Data Guru</h1>
<div class="grid lg:grid-cols-3 gap-6">
  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="font-bold mb-4">{{ 'Edit' if edit else 'Tambah' }} Guru</h2>
    <form method="POST" class="space-y-3">
      <input type="hidden" name="id" value="{{ edit.id if edit else '' }}">
      <div>
        <label class="block text-sm mb-1">NIP</label>
        <input type="text" name="nip" required value="{{ edit.nip if edit else '' }}"
               {{ 'readonly' if edit }} class="w-full px-3 py-2 border rounded-lg">
        {% if not edit %}
          <p class="text-xs text-gray-500 mt-1">Username & password default = NIP</p>
        {% endif %}
      </div>
      <div>
        <label class="block text-sm mb-1">Nama</label>
        <input type="text" name="nama" required value="{{ edit.nama if edit else '' }}"
               class="w-full px-3 py-2 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm mb-1">Mata Pelajaran</label>
        <input type="text" name="mapel" value="{{ edit.mapel if edit else '' }}"
               class="w-full px-3 py-2 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm mb-1">Jenis Kelamin</label>
        <select name="jk" class="w-full px-3 py-2 border rounded-lg">
          <option value="L" {{ 'selected' if edit and edit.jk=='L' }}>Laki-laki</option>
          <option value="P" {{ 'selected' if edit and edit.jk=='P' }}>Perempuan</option>
        </select>
      </div>
      <button class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
        {{ 'Update' if edit else 'Simpan' }}
      </button>
    </form>
  </div>

  <div class="lg:col-span-2 bg-white rounded-xl shadow p-6 overflow-x-auto">
    <h2 class="font-bold mb-4">Daftar Guru</h2>
    <table class="w-full text-sm">
      <thead class="bg-gray-100 text-left">
        <tr><th class="p-3">NIP</th><th class="p-3">Nama</th>
            <th class="p-3">Mapel</th><th class="p-3">Aksi</th></tr>
      </thead>
      <tbody>
        {% for r in data %}
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">{{ r.nip }}</td>
            <td class="p-3">{{ r.nama }}</td>
            <td class="p-3">{{ r.mapel }}</td>
            <td class="p-3 space-x-2">
              <a href="{{ url_for('guru', edit=r.id) }}" class="text-blue-600"><i class="fas fa-edit"></i></a>
              <a href="{{ url_for('guru_hapus', id=r.id) }}"
			   data-confirm="Yakin ingin menghapus guru '{{ r.nama }}' (NIP {{ r.nip }})?"
			   data-confirm-type="danger"
			   class="text-red-600 hover:text-red-800 transition"><i class="fas fa-trash"></i></a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
