{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Data Kelas</h1>
<div class="grid lg:grid-cols-3 gap-6">

  <!-- Form -->
  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="font-bold mb-4">{{ 'Edit' if edit else 'Tambah' }} Kelas</h2>
    <form method="POST" class="space-y-4">
      <input type="hidden" name="id" value="{{ edit.id if edit else '' }}">
      <div>
        <label class="block text-sm mb-1">Nama Kelas</label>
        <input type="text" name="nama_kelas" required value="{{ edit.nama_kelas if edit else '' }}"
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm mb-1">Tingkat</label>
        <input type="text" name="tingkat" value="{{ edit.tingkat if edit else '' }}"
               placeholder="X / XI / XII"
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
        {{ 'Update' if edit else 'Simpan' }}
      </button>
      {% if edit %}
        <a href="{{ url_for('kelas') }}" class="block text-center text-sm text-gray-500 hover:underline">Batal</a>
      {% endif %}
    </form>
  </div>

  <!-- Table -->
  <div class="lg:col-span-2 bg-white rounded-xl shadow p-6">
    <h2 class="font-bold mb-4">Daftar Kelas</h2>
    <table class="w-full text-sm">
      <thead class="bg-gray-100 text-left">
        <tr><th class="p-3">No</th><th class="p-3">Nama Kelas</th>
            <th class="p-3">Tingkat</th><th class="p-3">Aksi</th></tr>
      </thead>
      <tbody>
        {% for r in data %}
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">{{ loop.index }}</td>
            <td class="p-3">{{ r.nama_kelas }}</td>
            <td class="p-3">{{ r.tingkat }}</td>
            <td class="p-3 space-x-2">
              <a href="{{ url_for('kelas', edit=r.id) }}" class="text-blue-600"><i class="fas fa-edit"></i></a>
              <a href="{{ url_for('kelas_hapus', id=r.id) }}"
			   data-confirm="Yakin ingin menghapus kelas '{{ r.nama_kelas }}'?"
			   data-confirm-type="danger"
			   class="text-red-600 hover:text-red-800 transition"><i class="fas fa-trash"></i></a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
